<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Автомобили | Автосалон Renault</title>
  <link rel="shortcut icon" type="image/x-icon" href="renault.ico">
  <link rel="stylesheet" href="styles/styles.css">
  <style>
    .search-box {
      font-size: 0.95rem;
      padding: 8px 16px;
      border-radius: var(--radius);
      border: 2px solid var(--yellow);
      background: var(--dark);
      color: var(--white);
      outline: none;
      min-width: 220px;
      transition: border-color var(--transition);
    }
    .search-box:focus {
      border-color: var(--yellow-dark);
    }
    .empty-catalog {
      text-align: center;
      grid-column: 1 / -1;
      padding: 40px;
      color: rgba(255, 255, 255, 0.6);
      font-size: 1.1rem;
    }
  </style>
</head>

<body>
  <header>
    <h1>Автосалон Renault</h1>
    <button class="menu-toggle" aria-label="Меню">
      <span></span><span></span><span></span>
    </button>
    <nav>
      <ul>
        <li><a href="index.html">Главная</a></li>
        <li><a href="cars.html">Автомобили</a></li>
        <li><a href="about.html">О нас</a></li>
        <li><a href="contacts.html">Контакты</a></li>
      </ul>
    </nav>
  </header>

  <main class="catalog">
    <h2>Модельный ряд</h2>
    
    <div class="filter">
      <label for="search">Поиск:</label>
      <input type="text" id="search" class="search-box" placeholder="Название или характеристика...">

      <label for="type">Тип кузова:</label>
      <select id="type">
        <option value="all">Все типы</option>
        <option value="suv">Внедорожник</option>
        <option value="sedan">Седан</option>
        <option value="hatchback">Хетчбэк</option>
      </select>
    </div>

    <ul class="car-list" id="car-list">
      <!-- Генерируется через JS из data/cars.js -->
    </ul>
  </main>

  <footer>
    <p>&copy; Renault Group 2023</p>
  </footer>

  <script src="scripts/main.js"></script>
  <script src="data/cars.js"></script>
  <script>
    (function () {
      const listEl = document.getElementById('car-list');
      const typeSelect = document.getElementById('type');
      const searchInput = document.getElementById('search');

      function renderCars() {
        const selectedType = typeSelect.value;
        const searchQuery = searchInput.value.trim().toLowerCase();

        const filtered = CARS.filter(car => {
          const matchType = selectedType === 'all' || car.type === selectedType;
          const matchSearch = !searchQuery || 
            car.name.toLowerCase().includes(searchQuery) ||
            car.description.toLowerCase().includes(searchQuery) ||
            car.typeName.toLowerCase().includes(searchQuery);
          return matchType && matchSearch;
        });

        if (filtered.length === 0) {
          listEl.innerHTML = '<li class="empty-catalog">Автомобилей по заданным критериям не найдено.</li>';
          return;
        }

        listEl.innerHTML = filtered.map(car => `
          <li class="car ${car.type}" data-type="${car.type}">
            <img src="${car.image}" alt="${car.name}" loading="lazy">
            <div class="car-body">
              <span class="type-badge">${car.typeName}</span>
              <h3>${car.name}</h3>
              <p>${car.description}</p>
              <a href="car.html?model=${car.id}" class="button">Подробнее</a>
            </div>
          </li>
        `).join('');
      }

      typeSelect.addEventListener('change', renderCars);
      searchInput.addEventListener('input', renderCars);

      // Инициализация при загрузке
      renderCars();
    })();
  </script>
</body>

</html>
